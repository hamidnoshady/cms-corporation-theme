name: Theme verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: theme-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:runtime
      - run: pnpm format:check
      - run: pnpm verify
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: docker/setup-buildx-action@v3
      - name: Build a reusable image (no runtime credentials)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: apex-smoke:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke (local health, both locales)
        run: |
          docker run -d --name apex-smoke -p 3000:3000 -e APEX_DEMO_MODE=true apex-smoke:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          pnpm smoke
      - name: Remove test container
        if: always()
        run: docker rm -f apex-smoke || true
